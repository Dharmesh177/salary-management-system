[build]
  command = "npm ci && npm run build -w frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API to Render so browser calls same-origin /api (works with CSP + cookies)
[[redirects]]
  from = "/api/*"
  to = "https://salary-management-system-3gwl.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
